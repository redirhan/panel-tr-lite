# İZLEYİCİ paneli — Panel TR Lite (10 kişi, hızlı kontrol).
# Bu 10 kart Pro sürümdeki 30 izleyici kartının birebir alt kümesidir (aynı id'ler). Yaş bantları:
# 18-24 (2), 25-34 (3), 35-44 (2), 45-54 (2), 55+ (1); metropol / Anadolu / köy, yoğun / hafif Instagram,
# şüpheci ve düşük teknolojili kişiler dahil.
# Kanıt durumu: yaş/cinsiyet/platform dağılımı kaynaklı (sources/); kişilik ve zevk özellikleri [varsayım].
# Alanların açıklaması için Pro sürümdeki viewers.yaml başlığına ya da README'ye bakın:
#   deneme = yeni bir mekânı/ürünü deneme ya da internetten bir şey alma sıklığı (duzenli|ara_sira|nadiren|hic),
#   stance = sadece sıralama etiketi (kişiye gösterilmez), voice = ton tarifi.

